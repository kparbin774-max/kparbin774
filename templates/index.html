<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopBot Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; text-align: center; }
        .stats-grid { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .card { background: #334155; padding: 20px; border-radius: 8px; flex: 1; min-width: 200px; text-align: center; }
        .card h3 { margin: 0; color: #94a3b8; font-size: 16px; }
        .card p { font-size: 24px; font-weight: bold; color: #38bdf8; margin: 10px 0 0 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 ShopBot Reseller Dashboard</h1>
        <p style="text-align: center; color: #94a3b8;">Welcome to your automated management system</p>
        
        <div class="stats-grid">
            <div class="card">
                <h3>Credit Balance</h3>
                <p>₹ 14,380</p>
            </div>
            <div class="card">
                <h3>Active Keys</h3>
                <p>1,630</p>
            </div>
            <div class="card">
                <h3>Total Generated</h3>
                <p>4,520</p>
            </div>
        </div>
    </div>
</body>
</html>
