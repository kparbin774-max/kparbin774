<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - Generate Keys</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0b0f19; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #151c2c; padding: 25px; border-radius: 12px; border: 1px solid #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; text-align: center; font-size: 22px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #94a3b8; font-weight: bold; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 14px; box-sizing: border-box; }
        input:focus, select:focus, textarea:focus { border-color: #38bdf8; outline: none; }
        .btn-submit { width: 100%; padding: 14px; background: #38bdf8; border: none; border-radius: 8px; color: #0b0f19; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-submit:hover { background: #0ea5e9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Generate Keys</h1>
        
        <form action="/add_keys" method="POST">
            <div class="form-group">
                <label>Product Type</label>
                <input type="text" name="product_code" placeholder="e.g. FreeFire_iOS_Vip" required>
            </div>
            
            <div class="form-group">
                <label>Validity / License Keys</label>
                <textarea name="keys" rows="5" placeholder="Enter license keys (One per line)&#10;KEY1-XXXX-YYYY&#10;KEY2-XXXX-YYYY" required></textarea>
            </div>

            <button type="submit" class="btn-submit">Generate Now</button>
        </form>
    </div>
</body>
</html>
